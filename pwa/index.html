<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Painter's Servant</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <h1>Painter's Servant</h1>
    <p class="subtitle">Event Checklist</p>

    <div id="install-prompt" class="install-prompt hidden">
      <p class="install-text"></p>
      <button onclick="dismissInstall()">Got it</button>
    </div>

    <div id="load-section">
      <label class="file-btn">
        Load Checklist File
        <input type="file" accept=".json" onchange="loadFile(event)" hidden>
      </label>
    </div>

    <div id="checklist"></div>
    <p id="empty" class="empty">Load a checklist file exported from the desktop app.</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
