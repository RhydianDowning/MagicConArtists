<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SignatureHunter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #e6edf3; padding: 2rem; }
    h1 { text-align: center; font-size: 2.2rem; font-weight: 300; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 0.5rem; }
    .subtitle { text-align: center; color: #6fffe9; font-size: 0.85rem; letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 2rem; opacity: 0.7; }
    .settings-wrapper { position: absolute; top: 1rem; right: 1rem; }
    .settings-btn { background: none; border: none; color: #8b949e; font-size: 1.4rem; cursor: pointer; padding: 0.3rem; width: auto; margin: 0; }
    .settings-btn:hover { color: #e6edf3; }
    .settings-menu { position: absolute; top: 2rem; right: 0; background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 0.3rem; min-width: 140px; }
    .settings-menu button { background: none; border: none; color: #e6edf3; padding: 0.5rem 0.75rem; width: 100%; text-align: left; cursor: pointer; font-size: 0.85rem; border-radius: 4px; margin: 0; }
    .settings-menu button:hover { background: #1c2330; }

    /* Setup panel */
    #setup { max-width: 500px; margin: 0 auto; }
    label { display: block; font-size: 0.85rem; color: #8b949e; margin-bottom: 0.3rem; margin-top: 1rem; }
    .checkbox-group { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 0.5rem; max-height: 160px; overflow-y: auto; }
    .checkbox-group.highlight { border-color: #f0883e; box-shadow: 0 0 6px rgba(240,136,62,0.4); transition: border-color 0.3s, box-shadow 0.3s; }
    .checkbox-group label { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.5rem; margin: 0; border-radius: 4px; cursor: pointer; color: #e6edf3; font-size: 0.9rem; }
    .checkbox-group label:hover { background: #1c2330; }
    .checkbox-group input[type="checkbox"], .checkbox-group input[type="radio"] { accent-color: #6fffe9; width: 16px; height: 16px; }
    .delete-btn { margin-left: auto; color: #f85149; cursor: pointer; font-size: 0.8rem; padding: 0 0.4rem; opacity: 0; transition: opacity 0.2s; }
    .checkbox-group label:hover .delete-btn { opacity: 1; }
    .empty-state { color: #8b949e; font-size: 0.85rem; margin: 0.5rem; font-style: italic; }
    .not-found-box { background: #3d1f1f; border: 1px solid #f85149; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 1rem; color: #f85149; font-size: 0.85rem; }
    .no-match-section { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 0.75rem 1rem; margin-top: 1.5rem; color: #8b949e; font-size: 0.85rem; }
    .no-match-section summary { cursor: pointer; color: #e6edf3; }
    .no-match-section ul { margin: 0.5rem 0 0; padding-left: 1.5rem; columns: 2; }
    .no-match-section li { padding: 0.15rem 0; }
    .find-bar { position: fixed; top: 0; right: 0; background: #161b22; border: 1px solid #30363d; border-radius: 0 0 0 6px; padding: 0.4rem 0.6rem; display: flex; align-items: center; gap: 0.4rem; z-index: 999; }
    .find-bar input { background: #0d1117; border: 1px solid #30363d; color: #e6edf3; padding: 0.3rem 0.5rem; border-radius: 4px; font-size: 0.85rem; width: 180px; }
    .find-bar button { background: none; border: none; color: #8b949e; cursor: pointer; font-size: 0.85rem; padding: 0.2rem 0.4rem; margin: 0; width: auto; }
    .find-bar button:hover { color: #e6edf3; }
    .find-bar #find-count { color: #8b949e; font-size: 0.8rem; }
    .find-highlight { background: rgba(255, 200, 0, 0.3); border-radius: 2px; }
    .find-highlight-active { background: rgba(255, 200, 0, 0.7); }
    button { margin-top: 1.5rem; width: 100%; padding: 0.7rem; background: #238636; border: none; color: #fff; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #2ea043; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .import-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .import-row input { flex: 1; padding: 0.5rem; background: #161b22; border: 1px solid #30363d; color: #e6edf3; border-radius: 6px; font-size: 0.85rem; }
    .import-row button { margin-top: 0; width: auto; padding: 0.5rem 1rem; font-size: 0.85rem; }
    #import-status { font-size: 0.8rem; margin-top: 0.3rem; color: #6fffe9; }
    .hint { font-size: 0.75rem; color: #8b949e; margin: 0.3rem 0 0; line-height: 1.4; }
    .hint code { background: #161b22; padding: 0.1rem 0.3rem; border-radius: 3px; color: #e6edf3; }
    #deck-save-status { font-size: 0.8rem; margin-top: 0.3rem; color: #6fffe9; }
    .secondary-btn { background: #161b22; border: 1px solid #30363d; color: #e6edf3; margin-top: 0.5rem; }
    .secondary-btn:hover { background: #1c2330; }
    .tertiary-btn { background: none; border: 1px solid transparent; color: #8b949e; margin-top: 0.5rem; font-size: 0.8rem; padding: 0.4rem 0.75rem; cursor: pointer; width: auto; border-radius: 6px; }
    .tertiary-btn:hover { background: #161b22; border-color: #30363d; color: #e6edf3; }
    .sub-label { font-size: 0.8rem; color: #8b949e; margin-top: 0.75rem; margin-bottom: 0; }
    #new-artist-form input[type="text"], #new-deck-form input[type="text"] { width: 100%; padding: 0.5rem; background: #161b22; border: 1px solid #30363d; color: #e6edf3; border-radius: 6px; font-size: 0.85rem; margin-top: 0.3rem; }
    #new-artist-form textarea, #new-deck-form textarea { width: 100%; padding: 0.5rem; background: #161b22; border: 1px solid #30363d; color: #e6edf3; border-radius: 6px; font-size: 0.85rem; margin-top: 0.3rem; resize: vertical; font-family: inherit; }
    .artist-entry { display: flex; gap: 0.5rem; margin-top: 0.4rem; align-items: center; }
    .artist-entry input { flex: 1; padding: 0.5rem; background: #161b22; border: 1px solid #30363d; color: #e6edf3; border-radius: 6px; font-size: 0.85rem; }
    .artist-entry .delete-btn { opacity: 1; position: static; margin-left: 0; }
    #artist-entries { max-height: 200px; overflow-y: auto; }
    #artist-list-status { font-size: 0.8rem; margin-top: 0.3rem; color: #6fffe9; }

    /* Progress */
    #progress { text-align: center; margin-top: 1rem; font-size: 0.85rem; color: #8b949e; }
    .progress-bar { height: 4px; background: #21262d; border-radius: 2px; margin-top: 0.5rem; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: #6fffe9; transition: width 0.3s; }
    .fetch-hint { color: #8b949e; font-size: 0.8rem; margin-top: 0.5rem; font-style: italic; }
    .cancel-btn { background: none; border: 1px solid #30363d; color: #e6edf3; width: auto; padding: 0.3rem 0.75rem; font-size: 0.8rem; margin-top: 0.5rem; border-radius: 4px; }
    .cancel-btn:hover { background: #da3633; border-color: #da3633; }

    /* Results */
    #results { max-width: 1200px; margin: 0 auto; display: none; }
    .filters { text-align: center; margin-bottom: 2rem; }
    .filters button { width: auto; display: inline-block; background: #161b22; border: 1px solid #30363d; color: #e6edf3; padding: 0.5rem 1.2rem; border-radius: 6px; cursor: pointer; margin: 0 0.3rem; font-size: 0.85rem; }
    .filters button:hover { background: #1c2330; }
    .filters button.active { border-color: #6fffe9; color: #6fffe9; }
    details { margin-bottom: 1rem; border-radius: 10px; overflow: hidden; }
    summary { cursor: pointer; list-style: none; background: #161b22; padding: 1.2rem 1.5rem; display: flex; align-items: center; justify-content: center; position: relative; border-radius: 10px; transition: background 0.2s; }
    summary:hover { background: #1c2330; }
    summary::-webkit-details-marker { display: none; }
    summary h2 { margin: 0; font-size: 1.3rem; font-weight: 500; color: #6fffe9; letter-spacing: 0.05em; }
    summary::after { content: "▼"; color: #6fffe9; font-size: 1.1rem; position: absolute; right: 1.5rem; transition: transform 0.2s; opacity: 0.8; }
    details:not([open]) summary::after { transform: rotate(-90deg); }
    details:not([open]) summary { border-radius: 10px; }
    details[open] summary { border-radius: 10px 10px 0 0; border-bottom: 1px solid #21262d; }
    .booth { font-size: 0.75rem; font-weight: 400; color: #8b949e; margin-left: 0.75rem; }
    .grid { display: flex; flex-wrap: wrap; gap: 1rem; padding: 1.5rem; background: #0d1117; border: 1px solid #21262d; border-top: none; border-radius: 0 0 10px 10px; }
    .card { text-align: center; width: 200px; }
    .card img { width: 200px; border-radius: 8px; transition: transform 0.2s; }
    .card img:hover { transform: scale(1.05); box-shadow: 0 4px 20px rgba(111,255,233,0.15); }
    .card p { margin: .5rem 0; font-size: .85rem; }
    .card.sideboard, .card.considering { opacity: 0.4; }
    .card.sideboard:hover, .card.considering:hover { opacity: 0.7; }
    .board-label { display: block; font-size: 0.7rem; color: #8b949e; font-style: italic; margin-top: 0.25rem; }
    small { color: #7d8590; }
    .hidden { display: none !important; }
    .card.basicland { display: none; }
    .lands-only { display: none; }
    body.land-mode .lands-only { display: block; }
    body.land-mode details:not(.lands-only):not(.has-lands) { display: none; }
    body.land-mode .card:not(.basicland) { display: none !important; }
    body.land-mode .card.basicland { display: block !important; }
    .back-btn { display: inline-block; margin-bottom: 1.5rem; background: #161b22; border: 1px solid #30363d; color: #e6edf3; padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; width: auto; }
    .back-btn:hover { background: #1c2330; }
  </style>
</head>
<body>
  <div class="settings-wrapper">
    <button class="settings-btn" onclick="document.getElementById('settings-menu').classList.toggle('hidden')">⚙</button>
    <div id="settings-menu" class="settings-menu hidden">
      <button onclick="resetCache()">Reset Cache</button>
    </div>
  </div>
  <h1>Signature Hunter</h1>
  <p class="subtitle">Plan &bull; Your &bull; Meet</p>

  <div id="setup">
    <label>Decklists:</label>
    <div id="decks" class="checkbox-group"></div>
    <label class="sub-label">Import from Moxfield</label>
    <div class="import-row">
      <input type="text" id="moxfield-url" placeholder="Paste Moxfield deck URL...">
      <button type="button" id="import-btn" onclick="importMoxfield()">Import</button>
    </div>
    <div id="import-status"></div>
    <button type="button" class="tertiary-btn" onclick="toggleNewDeckForm()">or paste a decklist manually</button>
    <div id="new-deck-form" class="hidden">
      <label>Deck Name:</label>
      <input type="text" id="deck-name" placeholder="e.g. Mono Red Burn">
      <label>Paste your decklist:</label>
      <p class="hint">Accepts plain card names or Moxfield-style format.<br>e.g. <code>Lightning Bolt</code> or <code>1 Lightning Bolt (LEB) 162</code></p>
      <textarea id="deck-bulk" rows="4" placeholder="Lightning Bolt&#10;4 Dark Ritual (LEA) 98&#10;Counterspell"></textarea>
      <button type="button" onclick="saveDeck()">Save Decklist</button>
      <div id="deck-save-status"></div>
    </div>

    <label>Artist List:</label>
    <div id="artists" class="checkbox-group"></div>
    <button type="button" class="secondary-btn" onclick="toggleNewArtistForm()">+ New Artist List</button>
    <div id="new-artist-form" class="hidden">
      <label>List Name:</label>
      <input type="text" id="artist-list-name" placeholder="e.g. MagicCon Amsterdam 2026">
      <label>Mass Import (newline separated):</label>
      <textarea id="artist-bulk" rows="4" placeholder="Artist One&#10;Artist Two&#10;Artist Three"></textarea>
      <button type="button" class="secondary-btn" onclick="bulkImportArtists()">Import Names</button>
      <label>Artists:</label>
      <div id="artist-entries"></div>
      <button type="button" class="secondary-btn" onclick="addArtistRow()">+ Add Artist</button>
      <button type="button" onclick="saveArtistList()">Save Artist List</button>
      <div id="artist-list-status"></div>
    </div>

    <button id="run-btn" onclick="runMatch()">Find Matches</button>
    <div id="progress"></div>
  </div>

  <div id="results"></div>

  <div id="find-bar" class="find-bar hidden">
    <input type="text" id="find-input" placeholder="Find..." oninput="findInPage()">
    <span id="find-count"></span>
    <button onclick="findNext()">▼</button>
    <button onclick="findPrev()">▲</button>
    <button onclick="closeFindBar()">✕</button>
  </div>

  <script src="deck-import.js"></script>
  <script src="artist-list.js"></script>
  <script src="results.js"></script>
  <script src="app.js"></script>
</body>
</html>
